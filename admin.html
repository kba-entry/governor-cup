<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【運営専用】エントリー管理ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #1e3a8a;
      --text: #333333;
      --border: #e2e8f0;
      --confirmed: #dcfce7;
      --confirmed-text: #166534;
      --waiting: #fef3c7;
      --waiting-text: #92400e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }
    h1, h2 {
      margin-top: 0;
      color: var(--primary);
    }
    /* ログイン画面 */
    #login-section {
      max-width: 400px;
      margin: 100px auto;
      text-align: center;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 12px 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-success {
      background-color: #16a34a;
    }
    .btn-secondary {
      background-color: #64748b;
    }
    /* ダッシュボードヘッダー */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stats-container {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 6px;
      flex: 1;
      text-align: center;
    }
    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
    }
    /* テーブルスタイル */
    .table-wrapper {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      background-color: #f1f5f9;
      color: #475569;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
    }
    .badge-confirmed {
      background-color: var(--confirmed);
      color: var(--confirmed-text);
    }
    .badge-waiting {
      background-color: var(--waiting);
      color: var(--waiting-text);
    }
    .hidden {
      display: none !important;
    }
    #error-msg {
      color: #dc2626;
      font-size: 14px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 簡易ログイン画面 -->
    <div id="login-section" class="card">
      <h2>運営ログイン</h2>
      <p>パスワードを入力してください</p>
      <input type="password" id="password-input" placeholder="パスワード">
      <button onclick="login()">ログイン</button>
      <div id="error-msg"></div>
    </div>

    <!-- 2. ダッシュボードメイン画面 -->
    <div id="dashboard-section" class="card hidden">
      <div class="dashboard-header">
        <h1>エントリー管理ダッシュボード</h1>
        <div>
          <button class="btn-secondary" onclick="fetchEntries()">🔄 データ再取得</button>
          <button class="btn-success" onclick="downloadCSV()">📥 CSVダウンロード</button>
          <button class="btn-secondary" style="background:#ef4444;" onclick="logout()">ログアウト</button>
        </div>
      </div>

      <!-- 集計サマリー -->
      <div class="stats-container">
        <div class="stat-box">
          <div>総エントリー数</div>
          <div id="stat-total" class="stat-number">0</div>
        </div>
        <div class="stat-box">
          <div>確定枠</div>
          <div id="stat-confirmed" class="stat-number">0 / 96</div>
        </div>
        <div class="stat-box">
          <div>キャンセル待ち</div>
          <div id="stat-waiting" class="stat-number">0</div>
        </div>
      </div>

      <!-- エントリー一覧テーブル -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>受付日時</th>
              <th>ステータス</th>
              <th>氏名（漢字）</th>
              <th>氏名（フリガナ）</th>
              <th>CSカード番号</th>
              <th>CS申請中</th>
              <th>クラス</th>
              <th>所属店舗</th>
              <th>JAPA連盟</th>
              <th>電話番号</th>
              <th>メールアドレス</th>
            </tr>
          </thead>
          <tbody id="entries-tbody">
            <tr>
              <td colspan="12" style="text-align:center;">データを読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // --- ★Supabase接続情報の設定 ---
    // ※ index.html で使用されているものと同じURL・キーを設定してください
    const SUPABASE_URL = 'https://ilwvhrffpsdtrzpynafy.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_NaDQwcft5erHFQcY8BL8Lw_JY7EuadY';
    
    // パスワード設定
    const ADMIN_PASSWORD = 'admin2026';

    // Supabaseクライアントの初期化（変数名を AppSupabase に変更して衝突を回避）
    const AppSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentEntriesData = [];

    // パスワード認証（セッション状態の確認）
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('admin_authenticated') === 'true') {
        showDashboard();
      }
    });

    function login() {
      const input = document.getElementById('password-input').value;
      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem('admin_authenticated', 'true');
        showDashboard();
      } else {
        document.getElementById('error-msg').innerText = 'パスワードが正しくありません。';
      }
    }

    function logout() {
      sessionStorage.removeItem('admin_authenticated');
      location.reload();
    }

    function showDashboard() {
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      fetchEntries();
    }

    // エントリーデータの取得
    async function fetchEntries() {
      const tbody = document.getElementById('entries-tbody');
      tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;">最新データを取得中...</td></tr>';

      try {
        const { data, error } = await AppSupabase
          .from('entries')
          .select('*')
          .order('created_at', { ascending: true });

        if (error) throw error;

        currentEntriesData = data;
        renderTable(data);
        updateStats(data);
      } catch (err) {
        console.error('Error fetching data:', err);
        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center; color:red;">データの取得に失敗しました。</td></tr>';
      }
    }

    // テーブル描画
    function renderTable(data) {
      const tbody = document.getElementById('entries-tbody');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;">エントリーデータがありません。</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(item => {
        const date = new Date(item.created_at).toLocaleString('ja-JP');
        const isConfirmed = item.status === 'confirmed';
        const badgeClass = isConfirmed ? 'badge-confirmed' : 'badge-waiting';
        const statusLabel = isConfirmed ? '確定' : 'キャンセル待ち';

        return `
          <tr>
            <td>${item.id}</td>
            <td>${date}</td>
            <td><span class="badge ${badgeClass}">${statusLabel}</span></td>
            <td>${escapeHtml(item.last_name_kanji)} ${escapeHtml(item.first_name_kanji)}</td>
            <td>${escapeHtml(item.last_name_furigana)} ${escapeHtml(item.first_name_furigana)}</td>
            <td>${escapeHtml(item.member_id || '')}</td>
            <td>${item.is_cs_pending ? '申請中' : '-'}</td>
            <td>${escapeHtml(item.class_rank || '')}</td>
            <td>${escapeHtml(item.store_affiliation || '')}</td>
            <td>${item.is_japa_member ? '所属あり' : '-'}</td>
            <td>${escapeHtml(item.phone || '')}</td>
            <td>${escapeHtml(item.email || '')}</td>
          </tr>
        `;
      }).join('');
    }

    // 集計数値の更新
    function updateStats(data) {
      const total = data.length;
      const confirmed = data.filter(d => d.status === 'confirmed').length;
      const waiting = data.filter(d => d.status === 'waiting').length;

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-confirmed').innerText = `${confirmed} / 96`;
      document.getElementById('stat-waiting').innerText = waiting;
    }

    // CSVダウンロード機能（BOM付きUTF-8）
    function downloadCSV() {
      if (currentEntriesData.length === 0) {
        alert('出力対象のエントリーデータがありません。');
        return;
      }

      const headers = [
        "ID", "受付日時", "ステータス", "姓(漢字)", "名(漢字)", 
        "姓(フリガナ)", "名(フリガナ)", "CSカード番号", "CS申請中", 
        "クラス", "所属店舗", "JAPA連盟所属", "電話番号", "メールアドレス"
      ];

      const rows = currentEntriesData.map(item => [
        item.id,
        new Date(item.created_at).toLocaleString('ja-JP'),
        item.status === 'confirmed' ? '確定' : 'キャンセル待ち',
        item.last_name_kanji,
        item.first_name_kanji,
        item.last_name_furigana,
        item.first_name_furigana,
        item.member_id || '',
        item.is_cs_pending ? '申請中' : 'No',
        item.class_rank || '',
        item.store_affiliation || '',
        item.is_japa_member ? 'Yes' : 'No',
        item.phone || '',
        item.email || ''
      ]);

      let csvContent = "\uFEFF" + headers.join(",") + "\n";
      rows.forEach(row => {
        const line = row.map(val => `"${String(val).replace(/"/g, '""')}"`).join(",");
        csvContent += line + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const timestamp = new Date().toISOString().slice(0,10);
      
      link.setAttribute("href", url);
      link.setAttribute("download", `entries_export_${timestamp}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // HTMLエスケープ処理
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
